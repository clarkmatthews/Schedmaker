services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schedUser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    ports:
      - "5433:5432"
    volumes:
      - schedmaker-pg:/var/lib/postgresql/data

volumes:
  schedmaker-pg:
